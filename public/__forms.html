<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Detection</title>
</head>
<body>
  <form name="contacto-riise" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="nombre" />
    <input type="tel" name="telefono" />
    <input type="email" name="email" />
    <input type="text" name="proyecto" />
    <textarea name="mensaje"></textarea>
  </form>
</body>
</html>
